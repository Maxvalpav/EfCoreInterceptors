name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EfCoreInterceptors.slnx

      - name: Build (Release)
        run: dotnet build EfCoreInterceptors.slnx --no-restore -c Release

      - name: Test
        run: dotnet test EfCoreInterceptors.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/EfCore.Interceptors/EfCore.Interceptors.csproj -c Release -o artifacts

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Push symbols
        if: always()
        run: dotnet nuget push "artifacts/*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        continue-on-error: true
