name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EfCoreInterceptors.slnx

      - name: Build (Release)
        run: dotnet build EfCoreInterceptors.slnx --no-restore -c Release

      - name: Test
        run: dotnet test EfCoreInterceptors.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Pack
        run: dotnet pack src/EfCore.Interceptors/EfCore.Interceptors.csproj --no-build -c Release -o artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
